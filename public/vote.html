<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOTE! · Votación</title><link rel="stylesheet" href="/styles.css">
<style>
.top{display:flex;align-items:center;gap:8px;padding:14px 18px;font-weight:900}
.top .x{color:var(--mute)}.top .s{color:var(--red)}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px 50px}
.panel{background:var(--panel);border-radius:18px;padding:18px;text-align:center}
.nom{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel2);border-radius:12px;padding:8px;text-align:left;margin-top:10px}
.nom img,.nom .ph{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#111}
.nom .n{font-size:12px;font-weight:900;text-transform:uppercase}.nom .t{font-weight:900;text-transform:uppercase}
.nom .actions{display:grid;gap:6px}
.nom.mine{outline:2px solid var(--purple)}
.timer{font-weight:900;font-size:13px;color:var(--mute);margin-top:12px;font-variant-numeric:tabular-nums}
@media (max-width:480px){.nom{grid-template-columns:90px minmax(0,1fr)}.nom img,.nom .ph{width:90px}.nom .actions{grid-column:1/-1;grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div id="app"></div>
<script src="/common.js"></script>
<script>{
  const login = location.pathname.split('/')[2];
  const app = $('#app');
  let D = null, offset = 0, started = sessionStorage.getItem('vote-start') === '1', busy = false;

  const header = () => `<header class="top">${LOGO}${D ? `<span class="x">×</span><span class="s">${esc(D.streamer.display_name)}</span>` : ''}</header>`;

  async function load() {
    try { D = await api('/api/v/' + login); offset = D.voting.now - Date.now(); render(); }
    catch (e) { app.innerHTML = `${header()}<div class="splash"><div class="box"><h2>Ups</h2><p class="mute">${esc(e.message)}</p></div></div>`; }
  }
  function render() {
    if (!started) {
      app.innerHTML = `<main class="splash"><div class="box"><div><span class="logo big">VOTE<b>!</b></span><span class="logo-sub">for viewers</span></div>
        <button class="btn white pill" id="go">Comenzar</button></div></main>`;
      $('#go').onclick = () => { started = true; try { sessionStorage.setItem('vote-start', '1'); } catch {} render(); };
      return;
    }
    if (!D.me) {
      app.innerHTML = `${header()}<div class="wrap"><h3 style="text-align:center;margin:40px 0 20px">Conecta tu cuenta para comenzar</h3>
        <div class="panel"><a class="btn purple pill" href="/auth/login?next=${encodeURIComponent(location.pathname)}">Iniciar sesión con Twitch ${TWITCH_ICON}</a>
        <p class="small mute">Solo usamos tu cuenta para que cada persona vote una vez.</p></div></div>`;
      return;
    }
    const v = D.voting;
    if (v.status === 'idle' || !v.category) {
      app.innerHTML = `${header()}<main class="splash" style="min-height:70vh"><div class="box"><h2>No hay votación abierta</h2><p class="mute">Mantente en la misma sintonía: esta página se actualiza sola.</p></div></main>`;
      return;
    }
    if (v.status === 'ended') {
      const r = D.results, sorted = r ? [...r.items].sort((a, b) => b.votes - a.votes) : [];
      const w = sorted[0], tie = sorted[1] && w && sorted[1].votes === w.votes;
      app.innerHTML = `${header()}<div class="wrap"><div class="panel pop"><span class="pill-red">${esc(v.category.name)}</span>
        <h2 style="margin:16px 0 6px">${!r || !r.total ? 'Votación cerrada' : tie ? '¡Empate!' : '🏆 Ganador'}</h2>
        ${w && r.total && !tie ? `<h1 style="color:var(--purple)">${esc(w.title)}</h1><p class="mute">${w.votes} de ${r.total} votos</p>` : '<p class="mute">Gracias por participar.</p>'}</div></div>`;
      return;
    }
    if (D.myVote) {
      const c = D.nominees.find(n => n.id === D.myVote);
      app.innerHTML = `${header()}<main class="splash" style="min-height:70vh"><div class="box pop"><h1>Recibimos tu voto</h1>
        <p class="mute" style="margin:0">Votaste por <b>${esc(c ? c.title : '')}</b> en ${esc(v.category.name)}.<br>Mantente en la misma sintonía.</p><span class="ok-dot"></span>
        <div class="timer">Cierra en <span id="timer"></span></div></div></main>`;
      tickTimer(); return;
    }
    app.innerHTML = `${header()}<div class="wrap"><div class="panel">
      <span class="pill-red">Categoría actual: ${esc(v.category.name)}</span>
      <h3 style="margin:14px 0 4px">Selecciona tu favorito</h3>
      ${D.nominees.map((c, i) => `<div class="nom">${safeUrl(c.thumbnail) ? `<img src="${esc(safeUrl(c.thumbnail))}" alt="">` : '<div class="ph"></div>'}
        <div><div class="n mute">Nominado #${i + 1}</div><div class="t">${esc(c.title)}</div></div>
        <div class="actions"><button class="btn white pill sm" data-v="${esc(c.id)}">Votar</button><button class="btn ghost pill sm" data-w="${esc(c.slug)}" data-t="${esc(c.title)}">Ver clip</button></div></div>`).join('')}
      <div class="timer">Cierra en <span id="timer"></span></div></div></div>`;
    app.querySelectorAll('[data-w]').forEach(b => b.onclick = () => modal(`<h3 style="margin:0 34px 12px 0">${esc(b.dataset.t)}</h3>${clipEmbed(b.dataset.w)}`));
    app.querySelectorAll('[data-v]').forEach(b => b.onclick = async () => {
      const c = D.nominees.find(n => n.id === b.dataset.v);
      if (!(await confirmBox(`¿Votar por "${c.title}"? Solo puedes votar una vez.`, 'Votar', 'purple'))) return;
      busy = true;
      try { await api('/api/v/' + login + '/vote', { method: 'POST', body: { clipId: c.id } }); }
      catch (e) { toast(e.message, true); }
      busy = false; load();
    });
    tickTimer();
  }
  function tickTimer() { const t = $('#timer'); if (t && D) t.textContent = fmtTime(D.voting.endsAt - (Date.now() + offset)); }
  setInterval(() => {
    tickTimer();
    if (D && D.voting.status === 'live' && D.voting.endsAt - (Date.now() + offset) < -500 && !busy) load();
  }, 500);
  setInterval(() => { if (started && !busy && !$('.modal-bg')) load(); }, 3000);
  load();
}</script>
</body></html>
